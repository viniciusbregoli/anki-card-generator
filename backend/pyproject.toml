[project]
name = "anki-card-generator"
version = "0.1.0"
description = "AI-made language flashcards, added to a self-hosted Anki collection through anki-manager"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["card_generator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
